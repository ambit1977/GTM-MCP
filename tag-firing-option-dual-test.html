  <script>
  function summarize() {
    var log = window.__gtmFireLog || [];
    var counts = {};
    for (var i=0;i<log.length;i++) counts[log[i].option]=(counts[log[i].option]||0)+1;
    document.getElementById('out').textContent = JSON.stringify({counts:counts,total:log.length,log:log},null,2);
    return {counts:counts,total:log.length,log:log};
  }
  window.addEventListener('load', function(){
    setTimeout(function(){
      window.__gtmFireLog = [];
      window.dataLayer.push({event:'test_fire_dual', n:1});
      setTimeout(function(){ window.dataLayer.push({event:'test_fire_dual', n:2}); }, 300);
      setTimeout(function(){ window.dataLayer.push({event:'test_fire_dual', n:3}); }, 600);
      setTimeout(function(){ window.__lastSummary = summarize(); }, 1500);

  });
